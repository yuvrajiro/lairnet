[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lairnet"
version = "0.1.0"
description = "Fast leaky alignment-impulse randomized networks for tabular learning"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Rahul Goswami", email = "rahul.goswami.131997@gmail.com" },
]
keywords = [
  "randomized neural networks",
  "tabular regression",
  "ridge regression",
  "interpretability",
  "scikit-learn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
speed = [
  "numba>=0.58",
]
torch = [
  # 2.3 is the first release that works with numpy 2.x; earlier builds
  # raise "Numpy is not available" when converting a tensor back.
  "torch>=2.3",
]
plots = [
  "matplotlib>=3.7",
  "pandas>=1.5",
]
docs = [
  "sphinx>=7",
  "furo>=2024.1",
  "myst-nb>=1.0",
  "sphinx-design>=0.5",
  "sphinx-copybutton>=0.5",
  "matplotlib>=3.7",
  "pandas>=1.5",
]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "build>=1.0",
  "twine>=4",
]
all = [
  "numba>=0.58",
  "torch>=2.3",
  "matplotlib>=3.7",
  "pandas>=1.5",
]

[project.urls]
Documentation = "https://lairnet.statml.in/"
Source = "https://github.com/yuvrajiro/lairnet"
Issues = "https://github.com/yuvrajiro/lairnet/issues"

[tool.setuptools.packages.find]
include = ["lairnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py39"

# Pinned explicitly. Ruff's default selection changes between releases, so an
# unpinned config makes the same code pass one week and fail the next -- which
# is exactly what a lint gate must not do.
#
# The pyupgrade (UP) rules are safe here only because every module carries
# `from __future__ import annotations`: annotations stay strings at runtime, so
# `X | None` and `tuple[...]` work on the Python 3.9 this package supports.
[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes: unused imports and undefined names
  "I",    # import sorting
  "UP",   # pyupgrade: modern typing syntax
  "C4",   # flake8-comprehensions
  "RUF",  # ruff's own rules
]
