name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

# One Pages deployment at a time. Not cancel-in-progress: a half-finished
# deployment would leave the site in whatever state it reached.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      # Sphinx stops at the first extension it cannot import, so a missing
      # dependency reports one name and hides the rest. This names them all,
      # and fails before the build with a message that says what to add.
      - name: Check every Sphinx extension is installable from [docs]
        run: python docs/check_requirements.py
      # Sphinx builds cleanly whether or not a class named in a page has a rule
      # behind it, so this has to be checked separately.
      - name: Check that every page class is styled
        run: python docs/check_styles.py
      # Compares two committed artifacts, so it does not depend on the numpy
      # and scipy this runner happens to install.
      - name: Check the pages and the notebooks quote the same numbers
        run: python docs/check_numbers_agree.py
      # -W because the warnings this build produces are real: a bad docstring
      # renders as a mangled API page, and nobody reads build logs.
      - name: Build docs
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Check the notebooks were committed with their outputs
        run: |
          python - <<'PY'
          import sys, glob, nbformat
          bad = []
          for path in sorted(glob.glob("docs/examples/*.ipynb")):
              nb = nbformat.read(path, as_version=4)
              code = [c for c in nb.cells if c.cell_type == "code"]
              empty = [c for c in code if not c.get("outputs")]
              errors = [o for c in code for o in c.get("outputs", [])
                        if o.get("output_type") == "error"]
              print(f"{path}: {len(code)} code cells, {len(empty)} without "
                    f"output, {len(errors)} errors")
              if empty or errors:
                  bad.append(path)
          if bad:
              print("\nnb_execution_mode is off, so a notebook without stored "
                    "outputs renders as bare source. Run "
                    "`python docs/make_notebooks.py`.")
              sys.exit(1)
          PY

      # Packaged for Pages rather than as a plain artifact; deploy-pages below
      # only accepts this format.
      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to lairnet.statml.in
    needs: sphinx
    # Only the main branch publishes. Pull requests still build and run every
    # gate above, they just do not touch the live site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write          # publish to Pages
      id-token: write       # the OIDC token Pages verifies the deployment with
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
